# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: "@sohumdalal/daily-plate"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Daily Plate serves its own single-screen UI. Declaring `interfaces` at all
  # flips messaging to false, so both are spelled out.
  interfaces:
    frontend: true
    # The Slack adapter rides on the messaging sidecar. It forwards the
    # :knife_fork_plate: reaction and messages in observed channels.
    messaging: true
  healthcheck:
    path: /healthz
  inputs:
    # A GitHub App installed on the org, since `astropods` forbids personal
    # access tokens. It needs read access to Contents, Issues, Pull requests
    # and (org) Projects.
    - name: GITHUB_APP_ID
      datatype: string
      description: The GitHub App's numeric App ID.
    - name: GITHUB_APP_PRIVATE_KEY
      datatype: string
      secret: true
      description: The GitHub App's private key (the whole .pem file).
    - name: GITHUB_APP_INSTALLATION_ID
      datatype: string
      description: The App's installation ID on the org, from the end of the installation URL.
    - name: GITHUB_APP_CLIENT_ID
      datatype: string
      optional: true
      description: >-
        The same GitHub App's Client ID, from its settings page. With the
        secret, everyone signs in with GitHub and sees only their own plate.
        Add <app url>/api/auth/callback to the App's callback URLs.
    - name: GITHUB_APP_CLIENT_SECRET
      datatype: string
      secret: true
      optional: true
      description: A client secret generated on the same GitHub App's settings page.
    - name: TEAM
      datatype: string
      description: >-
        Everyone who may sign in, comma-separated, each as
        github-login:SLACK_MEMBER_ID, such as "sohumdalal:U08TSB1BZ5H,
        jessye:U0123ABCD". The first is the owner. Their reactions go on
        their own plate, :brain: into their own wrap, and a mention of them
        onto theirs.
    - name: GITHUB_PROJECTS
      datatype: string
      default: "astropods/1"
      description: >-
        Comma-separated `owner/number` GitHub Projects to read assigned cards
        from. Defaults to Astro Kanban. Needs the App's Projects
        permission.
    - name: GITHUB_ORGS
      datatype: string
      default: "astropods"
      description: >-
        Comma-separated GitHub owners whose every repo is searched for your
        open PRs and the open issues assigned to you.
    - name: SLACK_PROFILE_TOKEN
      datatype: string
      secret: true
      optional: true
      description: >-
        The Slack app's Bot User OAuth Token (xoxb-…), the same one the Slack
        adapter uses. With it the plate shows each Slack person's picture and
        real name, and Slack links open in the right workspace. Needs the
        users:read scope. Without it, names come from the messages you react
        to, there are no pictures, and links open in your last workspace.
    - name: TIMEZONE
      datatype: string
      default: "America/New_York"
      description: >-
        IANA timezone that decides what "cleared today" means, and where one
        day ends and the next begins for the wrap.

# → ASTRO_GATEWAY_URL, ASTRO_GATEWAY_API_KEY and MODEL_DEFAULT. The wraps and
# the Slack assistant both talk through the Astro AI gateway, as Capcom does.
models:
  default:
    provider: gateway
    models: [claude-sonnet-4-6]

# Bind to the shared store Daily Wrap used, so the laptop's nightly job and the
# deployed agent read and write the same days.
knowledge:
  daily-plate-db:
    provider: postgres

dev:
  interfaces:
    frontend:
      port: 3003
    messaging:
      adapters: [slack]
      slack:
        # Local only, and a pre-fill for the deploy form: SlackConfig() exists
        # on Dev alone. At deploy, set "Actionable Reactions" to
        # knife_fork_plate, brain and "Observe Channels" to the channel ids to
        # watch for mentions, under the Slack toggle.
        actionable_reactions: [knife_fork_plate, brain]
        observe_channel_ids: []
  command: bun --watch run start
