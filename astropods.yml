# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: "@sohumdalal/daily-plate"

agent:
  build:
    context: .
    dockerfile: Dockerfile
  # Daily Plate serves its own single-screen UI. Declaring `interfaces` at all
  # flips messaging to false, so both are spelled out.
  interfaces:
    frontend: true
    # The Slack adapter rides on the messaging sidecar. It forwards the
    # :knife_fork_plate: reaction and messages in observed channels.
    messaging: true
  healthcheck:
    path: /healthz
  inputs:
    # A GitHub App installed on the org, since `astropods` forbids personal
    # access tokens. It needs read access to Contents, Issues, Pull requests
    # and (org) Projects.
    - name: GITHUB_APP_ID
      datatype: string
      description: The GitHub App's numeric App ID.
    - name: GITHUB_APP_PRIVATE_KEY
      datatype: string
      secret: true
      description: The GitHub App's private key (the whole .pem file).
    - name: GITHUB_APP_INSTALLATION_ID
      datatype: string
      description: The App's installation ID on the org, from the end of the installation URL.
    - name: GITHUB_USERNAME
      datatype: string
      default: "sohumdalal"
      description: GitHub handle whose assigned cards make up the plate.
    - name: GITHUB_PROJECTS
      datatype: string
      default: "astropods/1"
      description: >-
        Comma-separated `owner/number` GitHub Projects to read assigned cards
        from. Defaults to Astro Kanban. Needs the App's Projects
        permission.
    - name: GITHUB_ORGS
      datatype: string
      default: "astropods"
      description: >-
        Comma-separated GitHub owners whose every repo is searched for your
        open PRs and the open issues assigned to you.
    - name: SLACK_USER_ID
      datatype: string
      optional: true
      description: >-
        Your Slack member id (U…). A message in an observed channel that
        mentions it lands on the plate, and only your own reactions count.
        Without it, mention capture is off and anyone's reaction counts.
    - name: TIMEZONE
      datatype: string
      default: "America/New_York"
      description: IANA timezone that decides what "cleared today" means.

knowledge:
  daily-plate-db:
    provider: postgres

dev:
  interfaces:
    frontend:
      port: 3003
    messaging:
      adapters: [slack]
      slack:
        # Local only, and a pre-fill for the deploy form: SlackConfig() exists
        # on Dev alone. At deploy, set "Actionable Reactions" to
        # knife_fork_plate and "Observe Channels" to the channel ids to watch
        # for mentions, under the Slack toggle.
        actionable_reactions: [knife_fork_plate]
        observe_channel_ids: []
  command: bun --watch run start
