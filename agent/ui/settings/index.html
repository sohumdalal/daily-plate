<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="What is on your plate today, and a written record of what you did." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Settings — Daily Plate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/settings/settings.css" />
    <script src="/shell.js"></script>
  </head>
  <body>
    <nav class="topnav">
      <a class="wordmark" href="/"><span class="tick" aria-hidden="true"></span>Daily Plate</a>
      <div class="apptabs">
        <a class="apptab" href="/">Plate</a>
        <a class="apptab" href="/wrap/">Wrap</a>
      </div>
      <div class="nav-right">
        <div class="account" data-account></div>
      </div>
    </nav>

    <main class="shell">
      <header class="hero">
        <h1 class="label">Settings</h1>
      </header>

      <!-- One section per area. A new setting gets its own section and a link
           in the list on the left. -->
      <div class="settings">
        <nav class="settings-nav" aria-label="Settings sections">
          <a href="#account" aria-current="page">Account</a>
        </nav>

        <div class="settings-body">
          <section class="settings-section" id="account">
            <h2 class="settings-title">Account</h2>
            <p class="settings-lede">Whose plate this is, from your GitHub profile.</p>
            <div class="settings-row" id="me-row">
              <img class="account-avatar" id="me-avatar" alt="" />
              <div class="account-who">
                <span class="account-name" id="me-name"></span>
                <span class="account-login" id="me-login"></span>
              </div>
            </div>
            <div id="me-error" role="alert" hidden>
              <p class="note warn">Your GitHub profile did not load.</p>
              <button class="line-button" id="me-retry" type="button">Try again</button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/settings/settings.js"></script>
  </body>
</html>
