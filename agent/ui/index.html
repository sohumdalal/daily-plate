<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Plate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <nav class="topnav">
      <span class="wordmark"><span class="tick" aria-hidden="true"></span>Daily Plate</span>
      <div class="nav-right">
        <!-- Two ways to read the same plate. The thumb slides between them. -->
        <div class="views" id="views" role="group" aria-label="View">
          <span class="views-thumb" aria-hidden="true"></span>
          <button type="button" data-view="split" title="By source (V)">Split</button>
          <button type="button" data-view="all" title="Everything in one list (V)">All</button>
        </div>
        <span class="label read-at" id="read-at"></span>
        <button class="sync" id="sync" type="button" title="Re-read the boards (R)">Refresh</button>
      </div>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </nav>

    <main class="shell">
      <header class="hero">
        <!-- The day on the left, whose plate it is on the right: every card
             below is one assigned to this person. -->
        <div class="hero-top" data-flip="date">
          <p class="label" id="date">—</p>
          <a class="assignee" id="assignee" target="_blank" rel="noopener" hidden>
            <img class="avatar" id="assignee-avatar" alt="" width="20" height="20" />
            <span class="label">Assigned to me</span>
            <span class="assignee-name" id="assignee-name"></span>
          </a>
        </div>
        <div class="specs">
          <div class="spec-cell"><span class="spec-value" id="n-open" data-i="0"></span><span class="label">On the plate</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-board" data-i="1"></span><span class="label">From the boards</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-slack" data-i="2"></span><span class="label">From Slack</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-done" data-i="3"></span><span class="label">Cleared today</span></div>
        </div>
        <p class="note warn" id="provenance" hidden></p>
      </header>

      <!-- Sections are built per view: one per board and one for Slack when
           split, a single list when not. Cleared today closes both. -->
      <div id="lists"></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
