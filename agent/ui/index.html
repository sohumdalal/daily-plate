<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="What is on your plate today, and a written record of what you did." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Plate — Daily Plate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/mova/dist/mova.css" />
    <script src="/shell.js"></script>
    <script src="/mova/dist/index.js" type="module"></script>
  </head>
  <body>
    <nav class="topnav">
      <a class="wordmark" href="/"><span class="tick" aria-hidden="true"></span>Daily Plate</a>
      <div class="apptabs">
        <a class="apptab" href="/" aria-current="page">Plate</a>
        <a class="apptab" href="/wrap/">Wrap</a>
      </div>
      <div class="nav-right">
        <a class="apptab" href="/notifications/">Notifications</a>
        <div class="account" data-account></div>
      </div>
      <!-- Mova's progress line, while the boards are read. -->
      <div class="mova-progress" id="progress" aria-hidden="true"></div>
    </nav>

    <!-- Mova's loading shape, until the first plate arrives. -->
    <div class="plate-skeleton" id="plate-skeleton" aria-hidden="true"></div>
    <main class="shell">
      <h1 class="visually-hidden">Your plate</h1>
      <!-- The first read failed: nothing to show but why, and a way to try again. -->
      <div class="state-error" id="load-error" role="alert" hidden>
        <p class="empty-title">The plate did not load.</p>
        <p class="empty-caption" id="load-error-reason"></p>
        <div class="actions">
          <button class="btn" id="load-retry" type="button">Try again</button>
        </div>
      </div>
      <header class="hero">
        <!-- The day on the left, whose plate it is on the right: every card
             below is one assigned to this person. -->
        <div class="hero-top" data-flip="date">
          <div class="when">
            <p class="label" id="date">—</p>
            <button class="line-button" id="sync" type="button" title="Re-read GitHub (R)">Refresh</button>
            <span class="label read-at" id="read-at" aria-live="polite"></span>
          </div>
          <p class="label" id="assignee" hidden></p>
        </div>
        <div class="specs">
          <div class="spec-cell"><span class="spec-value" id="n-open" data-i="0"></span><span class="label">On the plate</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-github" data-i="1"></span><span class="label">Cards and issues</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-slack" data-i="2"></span><span class="label">From Slack</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-done" data-i="3"></span><span class="label">Cleared today</span></div>
        </div>
        <!-- A task of your own, with no board or Slack behind it. -->
        <form class="add" id="add">
          <input id="add-title" type="text" maxlength="2000" autocomplete="off"
                 placeholder="Add a task to the plate (N)" aria-label="New task" />
          <button class="line-button" id="add-submit" type="submit">Add</button>
        </form>
        <!-- Repo, section and state chips. One of each can be on at a time,
             and they combine. -->
        <div class="filters" id="filters"></div>
        <p class="note warn" id="provenance" role="status" aria-live="polite" hidden></p>
      </header>

      <!-- Sections: one per board, one each for your PRs and
           issues, one for your tasks, and one for Slack. Cleared today closes both. -->
      <div id="lists"></div>

      <div class="keys">
        <span><kbd>N</kbd> new task</span>
        <span><kbd>R</kbd> refresh</span>
        <span><kbd>Esc</kbd> clear filters</span>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
