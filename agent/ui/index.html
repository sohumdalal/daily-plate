<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Plate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <nav class="topnav">
      <span class="wordmark"><span class="tick" aria-hidden="true"></span>Daily Plate</span>
      <div class="nav-right">
        <span class="label read-at" id="read-at"></span>
        <button class="sync" id="sync" type="button" title="Re-read GitHub (R)">Refresh</button>
      </div>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </nav>

    <main class="shell">
      <header class="hero">
        <!-- The day on the left, whose plate it is on the right: every card
             below is one assigned to this person. -->
        <div class="hero-top" data-flip="date">
          <p class="label" id="date">—</p>
          <p class="label" id="assignee" hidden></p>
        </div>
        <div class="specs">
          <div class="spec-cell"><span class="spec-value" id="n-open" data-i="0"></span><span class="label">On the plate</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-github" data-i="1"></span><span class="label">Issues</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-slack" data-i="2"></span><span class="label">From Slack</span></div>
          <div class="spec-cell"><span class="spec-value" id="n-done" data-i="3"></span><span class="label">Cleared today</span></div>
        </div>
        <!-- A task of your own, with no board or Slack behind it. -->
        <form class="add" id="add">
          <input id="add-title" type="text" maxlength="2000" autocomplete="off"
                 placeholder="Add a task to the plate (N)" aria-label="New task" />
          <button class="sync" type="submit">Add</button>
        </form>
        <!-- Repo, section and state chips. One of each can be on at a time,
             and they combine. -->
        <div class="filters" id="filters"></div>
        <p class="note warn" id="provenance" hidden></p>
      </header>

      <!-- Sections: one per board, one each for your PRs and
           issues, one for your tasks, and one for Slack. Cleared today closes both. -->
      <div id="lists"></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
